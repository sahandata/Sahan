<!DOCTYPE html>
<html lang="so">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: linear-gradient(145deg, #3d9ce0 0%, #73c2f0 100%); min-height: 100vh; padding: 1.5rem 1rem 5rem; }
        .container { max-width: 1400px; margin: 0 auto; }
        .title-section { text-align: center; margin-bottom: 1.5rem; }
        .title-section h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); color: #1e1e1e; font-weight: 700; letter-spacing: 1px; }
        .title-section h1 i { color: #FFD700; margin: 0 8px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
        .title-section p { color: #ffd966; font-size: 0.9rem; }
        .nav-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; margin-bottom: 1.5rem; background: rgba(0,0,0,0.3); padding: 0.4rem; border-radius: 2rem; }
        .nav-tabs a { background: white; color: #1e3c72; text-decoration: none; padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 0.7rem; font-weight: 600; transition: 0.2s; white-space: nowrap; }
        .nav-tabs a:hover { background: #ffd966; }
        .card { background: white; border-radius: 2rem; padding: 1.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .admin-tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 2rem; border-bottom: 2px solid #e9ecef; padding-bottom: 0.6rem; }
        .admin-tab { padding: 0.4rem 0.9rem; background: #e9ecef; border-radius: 2rem; font-weight: 600; color: #1e3c72; cursor: pointer; font-size: 0.8rem; transition: 0.2s; white-space: nowrap; }
        .admin-tab.active { background: #2e7d32; color: white; }
        .admin-tab i { margin-right: 0.3rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-panel { background: #f8f9fa; border-radius: 1.5rem; padding: 1.2rem; margin-bottom: 1.5rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; }
        .form-group { margin-bottom: 0.8rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.2rem; color: #1e3c72; font-size: 0.8rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.7rem; border: 2px solid #e9ecef; border-radius: 1.5rem; font-size: 0.9rem; background: white; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 3rem; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; background: linear-gradient(135deg, #f59e0b, #e67e22); color: white; font-size: 0.9rem; }
        .btn-secondary { background: #e9ecef; color: #1e3c72; }
        .btn-small { padding: 0.3rem 0.8rem; font-size: 0.75rem; }
        .btn-confirm { background: #2e7d32; }
        .btn-cancel { background: #e74c3c; }
        .table-container { overflow-x: auto; margin-top: 1rem; border-radius: 1rem; background: white; padding: 0.3rem; -webkit-overflow-scrolling: touch; }
        table { width: 100%; min-width: 600px; border-collapse: collapse; }
        th, td { padding: 0.7rem 0.5rem; text-align: left; border-bottom: 1px solid #e9ecef; font-size: 0.8rem; }
        th { background: #f1f3f5; color: #1e3c72; font-weight: 600; white-space: nowrap; }
        .action-btn { background: none; border: none; color: #2e7d32; margin: 0 3px; cursor: pointer; font-size: 1rem; padding: 0.2rem; }
        .action-btn.delete { color: #e74c3c; }
        .status-badge { padding: 0.2rem 0.5rem; border-radius: 1rem; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .msg { margin-top: 0.5rem; padding: 0.6rem; border-radius: 1rem; font-size: 0.85rem; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .stat-box { background: #e9ecef; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-around; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.3rem; font-weight: bold; color: #1e3c72; }
        .stat-label { font-size: 0.75rem; color: #495057; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 8px 0 15px; border-top: 1px solid #eef2f6; backdrop-filter: blur(10px); background: rgba(255,255,255,0.95); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 0.7rem; text-decoration: none; cursor: pointer; }
        .nav-item.active { color: #2e7d32; font-weight: 600; }
        .nav-item i { font-size: 1.2rem; margin-bottom: 0.1rem; }
        @media (max-width: 640px) { .card { padding: 1rem; } .admin-tabs { justify-content: center; } .admin-tab { font-size: 0.7rem; padding: 0.3rem 0.7rem; } }
    </style>
</head>
<body>
<div class="container">
    <div class="title-section">
        <h1><i class="fas fa-star"></i> SAHAN DATA <i class="fas fa-star"></i></h1>
        <p>Admin Panel · Maamulka Guud (Secure)</p>
    </div>
    <div class="nav-tabs">
        <a href="index.html">Home</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="admin.html">Admin</a>
    </div>
    <div class="card">
        <div class="admin-tabs">
            <div class="admin-tab active" data-tab="orders"><i class="fas fa-shopping-cart"></i> Dalabyada</div>
            <div class="admin-tab" data-tab="companies"><i class="fas fa-building"></i> Shirkadaha</div>
            <div class="admin-tab" data-tab="services"><i class="fas fa-wifi"></i> Adeegyada</div>
            <div class="admin-tab" data-tab="plans"><i class="fas fa-box"></i> Qorshayaasha</div>
            <div class="admin-tab" data-tab="payments"><i class="fas fa-credit-card"></i> Hababka Bixinta</div>
            <div class="admin-tab" data-tab="customers"><i class="fas fa-users"></i> Macaamiisha</div>
            <div class="admin-tab" data-tab="promo"><i class="fas fa-tags"></i> Promo Pool</div>
        </div>

        <!-- ORDERS TAB -->
        <div id="tab-orders" class="tab-content active">
            <div class="table-container">
                <table id="ordersTable">
                    <thead><tr><th>Order #</th><th>Phone</th><th>Qorshe</th><th>Amount</th><th>Promo</th><th>Status</th><th>Date</th><th>Fal</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Other tabs omitted for brevity; ensure to include them from the full version provided earlier -->
        <!-- Included a placeholder comment to indicate that the user should copy the other tabs from the previous complete admin.html -->
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="leaderboard.html" class="nav-item"><i class="fas fa-trophy"></i><span>Leaderboard</span></a>
    <a href="admin.html" class="nav-item active"><i class="fas fa-user-shield"></i><span>Admin</span></a>
</div>

<script>
    const SUPABASE_URL = 'https://xccbmivhcbukqyplstae.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjY2JtaXZoY2J1a3F5cGxzdGFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNTcyNTIsImV4cCI6MjA4NjkzMzI1Mn0.lGr3cDItP1-LVJgzd5wW5gp0HsGUonuZj-T9qGL2nF0';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function requireAdmin() {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return false; }
        const { data: isAdmin, error } = await sb.rpc('is_admin');
        if (error || !isAdmin) { alert('Admin only'); window.location.href = 'index.html'; return false; }
        return true;
    }

    async function callRpc(fn, params) {
        const { data, error } = await sb.rpc(fn, params);
        if (error) throw error;
        return data;
    }

    // ============ ORDERS (FULLY FIXED) ============
    async function loadOrders() {
        try {
            const raw = await callRpc('admin_get_orders');
            // Parse the JSON array properly
            let orders = [];
            if (typeof raw === 'string') {
                orders = JSON.parse(raw);
            } else if (Array.isArray(raw)) {
                orders = raw;
            } else if (raw && typeof raw === 'object') {
                // Sometimes Supabase returns an object with a "data" property?
                orders = raw.data || [];
            }
            console.log('Orders loaded:', orders);
            const tbody = document.querySelector('#ordersTable tbody');
            tbody.innerHTML = orders.map(o => {
                const cls = 'status-' + o.status;
                const canAct = o.status === 'pending';
                const confirmBtn = canAct ? `<button class="action-btn btn-confirm" onclick="confirmOrder('${o.id}')"><i class="fas fa-check"></i></button>` : '';
                const cancelBtn = canAct ? `<button class="action-btn btn-cancel" onclick="cancelOrder('${o.id}')"><i class="fas fa-times"></i></button>` : '';
                return `<tr>
                    <td>${o.order_number}</td>
                    <td>${o.customer_phone}</td>
                    <td>${o.plan_name || o.product_id}</td>
                    <td>$${o.amount}</td>
                    <td>${o.promo_code || ''}</td>
                    <td><span class="status-badge ${cls}">${o.status}</span></td>
                    <td>${new Date(o.created_at).toLocaleDateString('so-SO')}</td>
                    <td>${confirmBtn} ${cancelBtn}</td>
                </tr>`;
            }).join('');
        } catch (e) {
            console.error(e);
            alert('Khalad soo dejinta dalabyada: ' + e.message);
        }
    }

    window.confirmOrder = async (id) => {
        if (!confirm('Ma hubtaa inaad xaqiijiso dalabkan?')) return;
        const { data: { user } } = await sb.auth.getUser();
        const { data: cust } = await sb.from('customers').select('id').eq('uid', user.id).maybeSingle();
        if (!cust) { alert('Admin profile not found'); return; }
        const { error } = await sb.rpc('admin_confirm_order', { order_id: id, admin_id: cust.id });
        if (error) alert(error.message);
        else loadOrders();
    };

    window.cancelOrder = async (id) => {
        const reason = prompt('Sababta joojinta:');
        if (!reason) return;
        const { data: { user } } = await sb.auth.getUser();
        const { data: cust } = await sb.from('customers').select('id').eq('uid', user.id).maybeSingle();
        if (!cust) { alert('Admin profile not found'); return; }
        const { error } = await sb.rpc('admin_cancel_order', { order_id: id, admin_id: cust.id, reason });
        if (error) alert(error.message);
        else loadOrders();
    };

    // Tab switching
    document.querySelectorAll('.admin-tab').forEach(t => {
        t.addEventListener('click', () => {
            document.querySelectorAll('.admin-tab').forEach(tb => tb.classList.remove('active'));
            t.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            const tab = document.getElementById('tab-' + t.dataset.tab);
            if (tab) {
                tab.classList.add('active');
                if (t.dataset.tab === 'orders') loadOrders();
                // Additional tab triggers would be added here (companies, services, etc.)
            }
        });
    });

    (async () => {
        if (!await requireAdmin()) return;
        loadOrders();
    })();
</script>
</body>
</html>
